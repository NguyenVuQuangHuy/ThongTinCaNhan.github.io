<!doctype html>
<html lang="vi">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Gallery - Nguyễn Vũ Quang Huy</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Thông tin</a></li>
                <li><a href="DuAn.html">Dự án</a></li>
                <li><a href="KinhNghiem.html">Kinh nghiệm</a></li>
                <li><a href="SoThich.html">Sở thích</a></li>
                <li><a href="Themanh.html">Thế mạnh</a></li>
                <li><a href="Sach.html">Sách</a></li>
                <li><a href="ChungChi.html">Chứng chỉ</a></li>
                <li style="color: red">
                    <a href="Gallery.html" class="active">Gallery</a>
                </li>
            </ul>
        </nav>

        <main>
            <section class="container">
                <h1 class="section-title">Góc kỷ niệm</h1>

                <div class="image-grid">
                    <div class="gallery-item">
                        <img
                            src="Anh/KiNiem1.jpg"
                            alt="Kỷ niệm 1"
                            onclick="openModal(this)"
                        />
                    </div>

                    <div class="gallery-item">
                        <img
                            src="Anh/KiNiem3.jpg"
                            alt="Kỷ niệm 3"
                            onclick="openModal(this)"
                        />
                    </div>

                    <div class="gallery-item">
                        <img
                            src="Anh/AnhDaiDien.jpg"
                            alt="Ảnh đại diện"
                            onclick="openModal(this)"
                        />
                    </div>
                </div>
            </section>
        </main>

        <div id="myModal" class="modal">
            <span class="close" onclick="closeModal()">&times;</span>
            <img class="modal-content" id="img01" />
            <div id="caption"></div>
        </div>

        <footer>
            <p>Copyright © 2026 Nguyễn Vũ Quang Huy.</p>
        </footer>

        <script>
            var modal = document.getElementById("myModal");
            var modalImg = document.getElementById("img01");
            var captionText = document.getElementById("caption");

            function openModal(element) {
                modal.style.display = "block";
                modalImg.src = element.src;
                captionText.innerHTML = element.alt;
            }

            function closeModal() {
                modal.style.display = "none";
            }

            // Bấm ra ngoài khoảng đen thì đóng
            window.onclick = function (event) {
                if (event.target == modal) {
                    modal.style.display = "none";
                }
            };
        </script>
    </body>
</html>
